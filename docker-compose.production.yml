# Karuna Platform - Production Docker Compose Configuration
#
# Usage:
#   1. Copy .env.production.example to .env
#   2. Fill in all required environment variables
#   3. Run: docker-compose -f docker-compose.production.yml up -d --build
#
# The portals are built inside Docker (multi-stage Dockerfiles in
# caregiver-portal/ and admin-portal/) — no manual `npm run build` needed.
# Override the API URL baked into the portal bundles with:
#   VITE_API_URL=https://api.example.com docker-compose ... up -d --build

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: karuna-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./server/db/admin_tables.sql:/docker-entrypoint-initdb.d/02-admin.sql:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karuna-internal
    deploy:
      resources:
        limits:
          memory: 512M

  # Backend API Server
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: karuna-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      METRICS_SECRET: ${METRICS_SECRET}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY}
      RECOVERY_KEK: ${RECOVERY_KEK}
      APP_BASE_URL: ${APP_BASE_URL}
    healthcheck:
      # GET /health returns { status: 'healthy' }; node:alpine has no
      # wget/curl, so use node's built-in fetch.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - karuna-internal
      - karuna-public
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Caregiver Portal (multi-stage build: node build -> nginx serve)
  caregiver-portal:
    build:
      context: ./caregiver-portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://karuna-api-production.up.railway.app}
    container_name: karuna-caregiver
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - karuna-public
    deploy:
      resources:
        limits:
          memory: 128M

  # Admin Portal (multi-stage build: node build -> nginx serve)
  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://karuna-api-production.up.railway.app}
    container_name: karuna-admin
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - karuna-public
    deploy:
      resources:
        limits:
          memory: 128M

  # Nginx Reverse Proxy (handles SSL termination)
  nginx:
    image: nginx:alpine
    container_name: karuna-nginx
    restart: always
    depends_on:
      - api
      - caregiver-portal
      - admin-portal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - karuna-public
    deploy:
      resources:
        limits:
          memory: 128M

  # Certbot for SSL certificate renewal
  certbot:
    image: certbot/certbot
    container_name: karuna-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
    driver: local

networks:
  karuna-internal:
    driver: bridge
    internal: true
  karuna-public:
    driver: bridge
